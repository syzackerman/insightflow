services:
  postgres:
    image: postgres:16
    container_name: insightflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
      POSTGRES_USER: ${POSTGRES_USER:-insightflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightflow_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - insightflow_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  insightflow_postgres_data:
