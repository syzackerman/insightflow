spring.application.name=insightflow-backend
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
insightflow.analytics.mode=${INSIGHTFLOW_ANALYTICS_MODE:auto}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/insightflow}
spring.datasource.username=${DATABASE_USERNAME:insightflow_user}
spring.datasource.password=${DATABASE_PASSWORD:insightflow_pass}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:2000}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

insightflow.ai.provider=${INSIGHTFLOW_AI_PROVIDER:local}
insightflow.ai.api-key=${OPENAI_API_KEY:}
insightflow.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
insightflow.ai.model=${OPENAI_MODEL:gpt-5.5}

insightflow.security.jwt-secret=${INSIGHTFLOW_JWT_SECRET:dev-only-change-me-dev-only-change-me}
insightflow.security.jwt-expiration-minutes=${INSIGHTFLOW_JWT_EXPIRATION_MINUTES:1440}
